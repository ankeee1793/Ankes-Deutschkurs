<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇩🇪 Lernen wir jede Woche Deutsch!</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, 'Microsoft JhengHei', sans-serif;
            background-color: #FFFDF0; /* 淺黃色背景 */
            color: #1A1A1A; /* 黑色文字 */
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(128, 0, 32, 0.08);
            border: 1px solid #F5E6CA;
        }

        h1 {
            color: #800020; /* 酒紅色標題 */
            text-align: center;
            margin-bottom: 25px;
            font-size: 2em;
        }

        /* 控制列：選單區塊 */
        .controls-bar {
            background-color: #800020; /* 酒紅色區塊 */
            color: #FFFFFF;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .controls-bar label {
            font-size: 1.1em;
            font-weight: bold;
        }

        .week-select {
            padding: 8px 12px;
            font-size: 1em;
            border-radius: 6px;
            border: 1px solid #CCC;
            background-color: #FFFFFF;
            color: #1A1A1A;
            cursor: pointer;
            font-weight: bold;
        }

        .section-title {
            border-bottom: 2px solid #800020;
            padding-bottom: 8px;
            color: #800020;
            margin-top: 30px;
        }

        .card {
            background: #FFFCF7;
            border-left: 5px solid #800020;
            margin: 15px 0;
            padding: 18px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .word-title {
            font-weight: bold;
            font-size: 1.3em;
            color: #1A1A1A;
        }

        .highlight {
            color: #800020;
            font-weight: bold;
        }

        .gender-tag {
            background-color: #800020;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-right: 5px;
        }

        .collo-box {
            margin-top: 6px;
            font-size: 0.92em;
            color: #555;
            background-color: #F7F3EB;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .example-box {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #E5D9C5;
            color: #333333;
        }

        .example-de { font-weight: 500; }
        .example-zh { color: #666666; font-size: 0.95em; }
    </style>
</head>
<body>

<div class="container">
    <h1>🇩🇪 Lernen wir jede Woche Deutsch!</h1>
    
    <!-- 週次切換區塊 -->
    <div class="controls-bar">
        <label for="week-select">📅 選擇學習週次：</label>
        <select id="week-select" class="week-select" onchange="changeWeek(this.value)">
        </select>
    </div>

    <h2 class="section-title">📌 本週核心單字 (5 個)</h2>
    <div id="words-container"></div>

    <h2 class="section-title">💬 本週重要句型 (2 個)</h2>
    <div id="patterns-container"></div>
</div>

<script>
    const allWeeksData = {
        "week5": {
            title: "Week 5 (本週最新)",
            words: [
                { article: "der", word: "Rasen", plural: "-", pos: "m.", detail: "草坪；草地", collo: "den Rasen mähen (剪草坪)", exampleDe: "Der Rasen ist grün und frisch.", exampleZh: "草坪綠油油且很新鮮。" },
                { article: "die", word: "Treppe", plural: "-n", pos: "f.", detail: "樓梯", collo: "die Treppe hochgehen (走樓梯上去)", exampleDe: "Ich nehme die Treppe.", exampleZh: "我走樓梯。" },
                { article: "das", word: "Wörterbuch", plural: "-¨er", pos: "n.", detail: "字典", collo: "im Wörterbuch nachschlagen (查字典)", exampleDe: "Ich brauche ein Wörterbuch.", exampleZh: "我需要一本字典。" },
                { article: "", word: "begeistert", plural: "", pos: "adj.", detail: "熱情的；興奮的", collo: "begeistert von etwas sein (對某事感到熱情)", exampleDe: "Sie ist sehr begeistert.", exampleZh: "她非常熱情/興奮。" },
                { article: "", word: "mutig", plural: "", pos: "adj.", detail: "勇敢的", collo: "ein mutiger Mensch (一個勇敢的人)", exampleDe: "Er ist sehr mutig.", exampleZh: "他非常勇敢。" }
            ],
            patterns: [
                { pattern: "..., dass ... [動詞放句末]", detail: "當引導 dass 從屬子句時，子句中的『變位動詞』必須移至句子最後面！", exampleDe: "Ich glaube, dass Deutsch lernen Spaß macht.", exampleZh: "我相信學德文很有趣。" },
                { pattern: "dass 例句與練習", detail: "例句 2：Er weiß, dass sie heute nach Hause geht. 💡 練習：Ich denke, dass er mutig ______. (ist/hat).", exampleDe: "Sie weiß, dass ich ein Wörterbuch brauche.", exampleZh: "她知道我需要一本字典。" }
],
},
"week4": {
            title: "Week 4 (過往內容)",
            words: [
                { article: "", word: "einsam", plural: "", pos: "adj.", detail: "孤單的；寂寞的", collo: "sich einsam fühlen (感到孤單)", exampleDe: "Heute fühle ich mich ein bisschen einsam.", exampleZh: "我今天感到有一點孤單。" },
                { article: "der", word: "Vorhang", plural: "-¨e", pos: "m.", detail: "窗簾；幕布", collo: "den Vorhang zumachen (把窗簾拉上)", exampleDe: "Der Vorhang ist gelb und schön.", exampleZh: "這個窗簾是黃色的，很漂亮。" },
                { article: "der", word: "Zuschauer", plural: "-", pos: "m.", detail: "觀眾", collo: "viele Zuschauer haben (有很多觀眾)", exampleDe: "Die Zuschauer sind sehr glücklich.", exampleZh: "觀眾們非常開心。" },
                { article: "der", word: "Berg", plural: "-e", pos: "m.", detail: "山；山峰", collo: "auf den Berg steigen (爬山)", exampleDe: "Der Berg ist sehr hoch.", exampleZh: "這座山很高。" },
                { article: "die", word: "Wimper", plural: "-n", pos: "f.", detail: "睫毛", collo: "lange Wimpern haben (有長睫毛)", exampleDe: "Sie hat sehr lange Wimpern.", exampleZh: "她有很長的睫毛。" }
            ],
            patterns: [
                { pattern: "Wenn es um + Akk. geht, ...", detail: "當談到……、如果是關於……（表達主題討論）", exampleDe: "Wenn es um Sprachen geht, lerne ich gern Deutsch.", exampleZh: "當談到語言時，我喜歡學德文。" },
                { pattern: "Wie spät ist es? / Es ist ... Uhr.", detail: "現在幾點了？ / 現在是……點。（時間表達）", exampleDe: "Wie spät ist es? — Es ist acht Uhr.", exampleZh: "現在幾點了？ — 現在是八點。" }
            ]
        },
        "week3": {
            title: "Week 3 (過往內容)",
            words: [
                { article: "der", word: "Pfirsich", plural: "-e", pos: "m.", detail: "桃子", collo: "einen Pfirsich essen (吃一顆桃子)", exampleDe: "Der Pfirsich ist süß und lecker.", exampleZh: "這個桃子又甜又好吃。" },
                { article: "die", word: "Backe", plural: "-n", pos: "f.", detail: "臉頰", collo: "rote Backen haben (有紅潤的臉頰)", exampleDe: "Das Kind hat rote Backen.", exampleZh: "這個小孩有紅潤的臉頰。" },
                { article: "", word: "schlucken", plural: "", pos: "v.", detail: "吞下；咽下", collo: "Wasser schlucken (吞下水 / 喝水)", exampleDe: "Ich schlucke die Medizin mit Wasser.", exampleZh: "我配水服下（吞下）藥物。" },
                { article: "die", word: "Laune", plural: "-n", pos: "f.", detail: "心情；情緒", collo: "gute Laune haben (心情好)", exampleDe: "Heute habe ich gute Laune!", exampleZh: "我今天心情很好！" },
                { article: "", word: "versunken", plural: "", pos: "adj.", detail: "沉浸的；專心致志的", collo: "in ein Buch versunken sein (沉浸在一本書中)", exampleDe: "Er ist in ein Buch versunken.", exampleZh: "他正沉浸在一本書中。" }
            ],
            patterns: [
                { pattern: "Ich habe + Akk. / Ich habe keinen/keine/kein + Akk.", detail: "我有…… / 我沒有……（表達持有與否定）", exampleDe: "Ich habe Zeit, aber er hat keine Zeit.", exampleZh: "我有時間，但他沒有時間。" },
                { pattern: "Was isst/trinkst du gern? — Ich esse/trinke gern + Akk.", detail: "你喜歡吃/喝什麼？ — 我喜歡吃/喝……（詢問與表達喜好）", exampleDe: "Was trinkst du gern? — Ich trinke gern Kaffee.", exampleZh: "你喜歡喝什麼？ — 我喜歡喝咖啡。" }
            ]
        },
        "week2": {
            title: "Week 2 (過往內容)",
            words: [
                { article: "der", word: "Apfel", plural: "-¨", pos: "m.", detail: "蘋果", collo: "einen Apfel essen (吃蘋果)", exampleDe: "Der Apfel ist rot.", exampleZh: "這個蘋果是紅色的。" },
                { article: "die", word: "Zeitung", plural: "-en", pos: "f.", detail: "報紙", collo: "Zeitung lesen (讀報紙)", exampleDe: "Ich lese die Zeitung.", exampleZh: "我在讀報紙。" },
                { article: "das", word: "Buch", plural: "-¨er", pos: "n.", detail: "書本", collo: "ein Buch lesen (看書)", exampleDe: "Das Buch ist interessant.", exampleZh: "這本書很有趣。" },
                { article: "", word: "verstehen", plural: "", pos: "v.", detail: "理解、明白", collo: "gut verstehen (很好理解)", exampleDe: "Ich verstehe Deutsch.", exampleZh: "我懂德文。" },
                { article: "", word: "pünktlich", plural: "", pos: "adj.", detail: "準時的", collo: "pünktlich kommen (準時到達)", exampleDe: "Er ist immer pünktlich.", exampleZh: "他總是很準時。" }
            ],
            patterns: [
                { pattern: "Ich möchte gerne + Akk. + haben / bestellen.", detail: "我想點/想要…… (禮貌表達)", exampleDe: "Ich möchte gerne einen Kaffee haben.", exampleZh: "我想要一杯咖啡。" },
                { pattern: "Wie viel kostet + Nom. ?", detail: "請問……多少錢？", exampleDe: "Wie viel kostet das Buch?", exampleZh: "這本書多少錢？" }
            ]
        },
        "week1": {
            title: "Week 1 (過往內容)",
            words: [
                { article: "der", word: "Tisch", plural: "-e", pos: "m.", detail: "桌子", collo: "am Tisch sitzen (坐在桌旁)", exampleDe: "Der Tisch ist groß.", exampleZh: "這張桌子很大。" },
                { article: "die", word: "Sonne", plural: "-", pos: "f.", detail: "太陽", collo: "die Sonne scheint (陽光明媚)", exampleDe: "Die Sonne scheint heute.", exampleZh: "今天陽光明媚。" },
                { article: "das", word: "Haus", plural: "-¨er", pos: "n.", detail: "房子", collo: "nach Hause gehen (回家)", exampleDe: "Das Haus ist schön.", exampleZh: "這棟房子很漂亮。" },
                { article: "", word: "lernen", plural: "", pos: "v.", detail: "學習", collo: "Deutsch lernen (學德文)", exampleDe: "Ich lerne Deutsch.", exampleZh: "我在學德文。" },
                { article: "", word: "schön", plural: "", pos: "adj.", detail: "美麗的、美好的", collo: "einen schönen Tag haben (祝有美好的一天)", exampleDe: "Das Wetter ist schön.", exampleZh: "天氣很好。" }
            ],
            patterns: [
                { pattern: "Wie heißt du? — Ich heiße ...", detail: "你叫什麼名字？ — 我叫……", exampleDe: "Wie heißt du? — Ich heiße Anke.", exampleZh: "你叫什麼名字？ — 我叫 Anke。" },
                { pattern: "Woher kommst du? — Ich komme aus ...", detail: "你來自哪裡？ — 我來自……", exampleDe: "Woher kommst du? — Ich komme aus Taiwan.", exampleZh: "你來自哪裡？ — 我來自台灣。" }
            ]
        }
    };
    // 初始化下拉選單
    const selectEl = document.getElementById("week-select");
    Object.keys(allWeeksData).forEach(key => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.innerText = allWeeksData[key].title;
        selectEl.appendChild(opt);
    });

    // 渲染特定週次內容
    function changeWeek(weekKey) {
        const data = allWeeksData[weekKey];

        // 渲染單字
        const wordsDiv = document.getElementById("words-container");
        wordsDiv.innerHTML = "";
        data.words.forEach(item => {
            const articleTag = item.article ? `<span class="gender-tag">${item.article}</span>` : '';
            const pluralInfo = item.plural ? ` <small style="color:#666;">(Pl. ${item.plural})</small>` : '';
            const colloInfo = item.collo ? `<div class="collo-box">🔗 常用搭配：${item.collo}</div>` : '';

            wordsDiv.innerHTML += `
                <div class="card">
                    <div>
                        ${articleTag}
                        <span class="word-title">${item.word}</span> ${pluralInfo}
                        <span style="color:#666;">[${item.pos}]</span>：<strong>${item.detail}</strong>
                    </div>
                    ${colloInfo}
                    <div class="example-box">
                        <div class="example-de">💡 例句：${item.exampleDe}</div>
                        <div class="example-zh">${item.exampleZh}</div>
                    </div>
                </div>`;
        });

        // 渲染句型
        const patternsDiv = document.getElementById("patterns-container");
        patternsDiv.innerHTML = "";
        data.patterns.forEach(item => {
            patternsDiv.innerHTML += `
                <div class="card">
                    <div class="word-title" style="color: #800020;">${item.pattern}</div>
                    <div><strong>用法說明：</strong>${item.detail}</div>
                    <div class="example-box">
                        <div class="example-de">💡 例句：${item.exampleDe}</div>
                        <div class="example-zh">${item.exampleZh}</div>
                    </div>
                </div>`;
        });
    }

    // 預設載入最新一週
    changeWeek(Object.keys(allWeeksData)[0]);
</script>

</body>
</html>
